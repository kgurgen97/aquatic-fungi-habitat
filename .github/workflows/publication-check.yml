name: Reproducibility checks
on:
  push:
    branches: [main, "submission/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python verify_plan_hashes.py
      - run: python analysis_heterogeneity.py
      - run: python analysis_agreement_power.py
      - run: python tests/test_publication.py
      - run: git diff --exit-code -- supplementary/Table_S15.tsv supplementary/Table_S16.tsv supplementary/Table_S17.tsv supplementary/Table_S18.tsv supplementary/Table_S19.tsv
